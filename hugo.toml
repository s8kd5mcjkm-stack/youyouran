baseURL = "https://s8kd5mcjkm-stack.github.io/youyouran/"
languageCode = "zh-cn"
title = "由由然"
theme = "PaperMod"
defaultContentLanguage = "zh"
hasCJKLanguage = true
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
paginate = 5

[params]
  env = "production"
  title = "由由然"
  description = "随心而动，由由然然"
  keywords = ["博客", "生活", "随笔"]
  author = "由由然"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.homeInfoParams]
    Title = "由由然 🌿"
    Content = "随心而动，由由然然 · 记录生活的点滴与思考"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/s8kd5mcjkm-stack"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 30

[markup]
  [markup.highlight]
    noClasses = false
